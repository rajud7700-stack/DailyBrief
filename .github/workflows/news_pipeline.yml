name: DailyBrief RSS AI Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILYBRIEF_API_KEY: ${{ secrets.DAILYBRIEF_API_KEY }}
        run: |
          python pipeline.py

      - name: Commit and Push Updated Deduplication State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen articles deduplication state [skip ci]" && git push)

      - name: Send Discord Alert on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
             -d '{"content": "🚨 DailyBrief pipeline run failed! Check GitHub Actions logs."}' $DISCORD_WEBHOOK_URL                    
